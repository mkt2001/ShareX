name: Build ShareX Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if it was uploaded as a zip
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "Unzipping $z"
              unzip -q -o "$z" -d _project
            fi
          fi

      - name: Find Gradle project folder
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found in repo or zip"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug and release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Copy APKs to release folder
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ShareXPro-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/ShareXPro-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareXPro-APKs
          path: ${{ steps.find.outputs.dir }}/release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ShareX Pro build ${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/release/*.apk
