name: Build ShareX Pro APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests and lint (non-blocking)
        continue-on-error: true
        run: gradle testDebugUnitTest lintDebug --stacktrace

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Copy APKs to release folder
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ShareXPro-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/ShareXPro-release.apk

      - name: Commit APKs into release/ folder
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release/*.apk
          git commit -m "Add APK build ${{ github.run_number }} [skip ci]" || echo "nothing to commit"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareXPro-APKs
          path: release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ShareX Pro build ${{ github.run_number }}
          files: release/*.apk
